name: cdv-phylo
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - pip
  # Alignment, ML trees, Nextstrain and NCBI tools come with wildphylo's spec;
  # listed here so a conda env created from this file alone is complete.
  - mafft>=7.520
  - iqtree>=2.2
  - trimal
  - seqkit
  - entrez-direct
  - ncbi-datasets-cli
  - augur>=24
  - auspice
  - snakemake>=8
  - conda-lock
  - pip:
    # The pipeline. Bump the tag deliberately; every build records it in provenance.
    - "wildphylo @ git+https://github.com/batyanight/wildphylo@v0.2.0"
# BEAST2, Tracer, TempEst and FigTree are Java tools installed separately:
#   BEAST2  https://www.beast2.org/
#   Tracer  https://beast.community/tracer
# Exact versions: conda-lock.yml (conda-lock lock -f environment.yml -p osx-arm64 -p linux-64).
